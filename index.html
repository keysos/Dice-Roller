<!DOCTYPE html>
<html lang="en">

<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll the Dice!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon_io/favicon-32x32.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <div class="app">
        <h1 class="title">DICE ROLLER</h1>


        <div class="input-container">
            <p># of dice <i class="fa-solid fa-dice" style="color: rgb(0, 0, 0);"></i> :
            </p>
            <input id="input-number" type="number">
            <button class="button" id="roll-dice">Roll Dice</button>
        </div>
        
        <p class="results" id="dice-results">Dice results: </p>

        <div class="dice-container">
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
